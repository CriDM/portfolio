<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded dark squircle background -->
  <rect width="64" height="64" rx="14" fill="#090d16" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  
  <!-- Minimalist geometric terminal prompt >_ -->
  <!-- Chevron '>' -->
  <path
    d="M19 21 L31 32 L19 43"
    stroke="#f8fafc"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Underscore '_' cursor -->
  <line
    x1="36"
    y1="43"
    x2="47"
    y2="43"
    stroke="#818cf8"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
