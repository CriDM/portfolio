<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="16" />

  <!-- Ambient inner light -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Stylized Geometric CDM / Code Chevron Monogram -->
  <g filter="url(#glow)">
    <!-- Terminal Chevron '>' -->
    <path
      d="M150 176 L240 256 L150 336"
      stroke="url(#glowGrad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Underscore / Cursor '_' -->
    <path
      d="M266 336 L362 336"
      stroke="#38bdf8"
      stroke-width="36"
      stroke-linecap="round"
    />

    <!-- Upper glowing tech node -->
    <circle cx="340" cy="186" r="18" fill="#818cf8" />
    <line x1="290" y1="216" x2="330" y2="192" stroke="#818cf8" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
